      <stop offset="0%" stop-color="#3a2417"/>
      <stop offset="100%" stop-color="#1c120a"/>
    </linearGradient>
    <linearGradient id="cupHot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf6ec"/>
      <stop offset="100%" stop-color="#e9dcc4"/>
    </linearGradient>
    <linearGradient id="coffeeHot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c9a15a"/>
      <stop offset="100%" stop-color="#6f4426"/>
