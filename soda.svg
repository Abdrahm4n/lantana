      <stop offset="0%" stop-color="#3a2417"/>
      <stop offset="100%" stop-color="#1c120a"/>
    </linearGradient>
    <linearGradient id="glassSoda" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eaf6f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#cfe7e7" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="liquidSoda" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8622c"/>
      <stop offset="100%" stop-color="#8f2f10"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#bgSoda)"/>
  <ellipse cx="150" cy="248" rx="58" ry="10" fill="#000" opacity="0.25"/>
