  <circle cx="135" cy="200" r="4" fill="#fff2df" opacity="0.7"/>
  <circle cx="150" cy="170" r="3" fill="#fff2df" opacity="0.6"/>
  <circle cx="165" cy="210" r="3.5" fill="#fff2df" opacity="0.6"/>
  <circle cx="140" cy="140" r="2.5" fill="#fff2df" opacity="0.5"/>
  <circle cx="160" cy="120" r="3" fill="#fff2df" opacity="0.5"/>
