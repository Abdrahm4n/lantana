<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgSweet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a2417"/>
      <stop offset="100%" stop-color="#1c120a"/>
    </linearGradient>
    <linearGradient id="cakeBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9c98f"/>
      <stop offset="100%" stop-color="#a9744f"/>
